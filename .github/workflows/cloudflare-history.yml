name: Cloudflare history
# Lists every version and deployment of the Worker, so an earlier one can be found and restored.
on:
  workflow_dispatch:
jobs:
  history:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deployments
        run: npx wrangler@4 deployments list --name motionforge-ai || true
      - name: Versions
        run: npx wrangler@4 versions list --name motionforge-ai || true
      - name: All Workers in the account
        run: |
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{try{const j=JSON.parse(s);if(!j.success){console.log(JSON.stringify(j.errors));return}for(const w of j.result)console.log(w.id,"| created",w.created_on,"| modified",w.modified_on)}catch(e){console.log(s.slice(0,300))}})'
