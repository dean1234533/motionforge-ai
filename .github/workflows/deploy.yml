name: Deploy
# Deploys the Worker to Cloudflare from GitHub. It only runs when you start it by hand (Actions tab > Deploy > Run workflow),
# so nothing changes on your live site unless you ask. Leave "ref" empty for the newest code, or give a commit to put an
# older version live. Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to deploy (empty = the newest code on main)
        required: false
        default: ''
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: secrets
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - name: Say why nothing happened
        if: steps.secrets.outputs.present != 'true'
        run: echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set as repository secrets, so nothing was deployed."
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.present == 'true'
        with:
          node-version: 22
      - if: steps.secrets.outputs.present == 'true'
        run: npm install
      - if: steps.secrets.outputs.present == 'true'
        run: npm run build
      - name: Deploy
        if: steps.secrets.outputs.present == 'true'
        run: |
          git log -1 --format='Deploying commit %h: %s'
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
