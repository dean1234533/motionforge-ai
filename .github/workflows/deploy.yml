name: Deploy
# Deploys the Worker to Cloudflare from GitHub. It does nothing until two repository secrets exist:
#   CLOUDFLARE_API_TOKEN   (Cloudflare > My Profile > API Tokens > "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID
# Once they do, every push to main deploys, and you can also run it by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: secrets
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - name: Say why nothing happened
        if: steps.secrets.outputs.present != 'true'
        run: echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set as repository secrets, so nothing was deployed."
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.present == 'true'
        with:
          node-version: 22
      - if: steps.secrets.outputs.present == 'true'
        run: npm install
      - if: steps.secrets.outputs.present == 'true'
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Deploy
        if: steps.secrets.outputs.present == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
