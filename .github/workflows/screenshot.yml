name: Screenshot
# Takes pictures of a live address so the design can be checked. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Address to photograph
        default: https://motionforge-ai.deanatthrive.workers.dev/
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null && npm install playwright@1.48.2 >/dev/null
      - run: npx playwright install --with-deps chromium >/dev/null
      - name: Take screenshots
        env:
          URL: ${{ inputs.url }}
        run: |
          mkdir shots
          cat > shot.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          const url = process.env.URL.replace(/\/$/, '');
          const b = await chromium.launch();
          for (const [name, opts] of [['desktop', { viewport: { width: 1280, height: 800 } }], ['phone', { ...devices['Pixel 5'] }]]) {
            const ctx = await b.newContext(opts);
            const page = await ctx.newPage();
            await page.goto(url + '/', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(2500);
            await page.screenshot({ path: `shots/${name}-1-landing-top.png` });
            await page.screenshot({ path: `shots/${name}-2-landing-full.png`, fullPage: true });
            await page.goto(url + '/#/login', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(500);
            await page.screenshot({ path: `shots/${name}-3-login.png` });
            await page.goto(url + '/#/editor', { waitUntil: 'domcontentloaded' });
            await page.getByRole('button', { name: 'Use sample bird' }).click();
            await page.waitForSelector('.frame iframe', { timeout: 60000 });
            await page.waitForTimeout(2500);
            await page.screenshot({ path: `shots/${name}-4-editor.png` });
            await page.screenshot({ path: `shots/${name}-5-editor-full.png`, fullPage: true });
            await page.goto(url + '/#/docs', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(500);
            await page.screenshot({ path: `shots/${name}-6-docs.png` });
            await ctx.close();
          }
          await b.close();
          JS
          node shot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
